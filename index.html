<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NailSizer — Find Your Perfect Nail Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <div class="logo">NAIL<span>SIZER</span></div>

  <div class="hero-illustration">
    <svg viewBox="0 0 200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="150" rx="70" ry="10" fill="#FFD9E2"/>
      <rect x="60" y="30" width="18" height="90" rx="9" fill="#FF6F91"/>
      <rect x="84" y="15" width="18" height="105" rx="9" fill="#FF87A3"/>
      <rect x="108" y="20" width="18" height="100" rx="9" fill="#FF6F91"/>
      <rect x="132" y="35" width="18" height="85" rx="9" fill="#FF87A3"/>
      <circle cx="45" cy="95" r="16" fill="none" stroke="#FF6F91" stroke-width="3" stroke-dasharray="4 4"/>
    </svg>
  </div>

  <h1>Find Your Perfect Nail Size in Seconds</h1>
  <p class="subtitle">
    Upload two photos using a coin, card, or bottle cap as a size reference.
    Our AI measures every nail accurately.
  </p>

  <div class="spacer"></div>

  <button class="btn btn-primary" onclick="location.href='camera.html?hand=left&step=reference'">
    Start Measuring
  </button>
  <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:14px;">
    <span id="trial-remaining"></span>
  </p>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('trial-remaining').textContent =
    `You have ${NailSizeTrial.remaining()} free scans remaining.`;
</script>
</body>
</html>
